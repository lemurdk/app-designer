<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html><head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script type="text/javascript" src="libs/jquery-3.6.0.js"></script>
        <script type="text/javascript" src="../../system/js/odkCommon.js"></script>
        <script type="text/javascript" src="../../system/js/odkData.js"></script>
        <script type="text/javascript" src="js/odkTables.js"></script>
        <script type="text/javascript" src="js/util.js"></script>
    <script>
        
        function goToList() {
            var selected_CS = $('#selCS').val();                    
            odkTables.launchHTML(null, 'config/assets/list.html?cs=' + encodeURIComponent(selected_CS));
            return false;
        }

        // This is the "on load" function
        $(function() {
            var cs = util.getQueryParameter("cs")
            if (!cs) cs = "NO_CENTER_SELECTED";
            if (cs == "NO_CENTER_SELECTED") {
                cs = "NO_CENTER_SELECTED";
                console.l
                $("#btnGo").hide();
            } else {
                $('#btnGo').on('click', goToList);
            }
           
            $("#selCS").val(cs);
            $("#selCS").on("change", function() {
                cs = this.value;
                console.log(this.url);
                window.location = window.location.pathname + "?cs=" + cs;
            })
        });
        </script>
        <style>
            body {
                background-color: black;
                color:white;
                text-align: center;
                font-family: Verdana, sans-serif;
            }
            #contentDiv {
                background-color: white;
                border:5px solid white;
                color:black;
                width:100%;
                margin:auto;                
            }
            select {
                line-height: 22pt;
                height: 40px;
                width:400px;
                border-radius: 0;
                font-size: 20pt;
            }
            #btnGo {
                line-height: 22pt;
                font-size: 22pt;
                height:50px;
                border-radius: 4px;
                width:200px;
                background-color:lightgreen;
                margin-top:40px;
                padding-right:20px;
                border:none;
                background-repeat: no-repeat;
                background-position:90% 0%;
                background-image:url('data:image/svg+xml;utf8,<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>')
            }
            h1 {
                padding-top: 50px;
            }
        </style>
</head>
<body id="main">
    <div class="contentDiv">

    <h1 id="facilitar-lista-visita">Criação de Postos Sentinelas para seguimento do paludismo e outras doenças</h1>
    <br/>
    <form>
        <div class="form-group">
            <select id="selCS">
                <option selected value="NO_CENTER_SELECTED">Seleciona Centro de Saúde</option>
                <option value="SB">Buba</option>
                <option value="SH">Canchungo</option>
                <option value="SGC">Gabú (CMI)</option>
                <option value="SGH">Gabú (hospital)</option>
                <option value="SBM">B. Militar</option>
            </select>
            <br/>
            <button class="btn btn-primary btn-block btn-launch" id="btnGo">Entrar</button>
        </div>
    </form>

</div></body>
</html>
