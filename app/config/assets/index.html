<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html><head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script type="text/javascript" src="libs/jquery-3.6.0.js"></script>
        <script>
        
        function goToList() {
            var selected_CS = $('#selCS').val();                    
            odkTables.launchHTML(null, 'config/assets/list.html?cs=' + encodeURIComponent(selected_CS));
        }

        // This is the "on load" function
        $(function() {
            
            $('#launch-button').on('click', goToList);
           
        });
        </script>
</head>
<body id="main"><div id="wrapper"><div class="container">

    <h1 id="facilitar-lista-visita">Studo de Sentinela</h1>
    <br/>
    <form>
        <div class="form-group">

            <label class="form-label" for="selCS">Seleciona centro:</label>

            <select class="form-control" id="selCS">
                <option selected value="">-</option>
                <option value="GabuCMI">Gabu CMI</option>
                <option value="GabuHospital">Gabu Hospital</option>
                <option value="Buba">Buba</option>
                <option value="Canchungu">Canchungu</option>
            </select>
            
            <button class="btn btn-primary btn-block btn-launch" id="launch-button">Entrar</button>
        </div>
    </form>

</div></div></body>
</html>
