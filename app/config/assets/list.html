        /* DB LOOKUP */
        var TESTMODE = false;
        function listRows(cs, consultor, visit_date) {
            if (TESTMODE) return;
            console.log("Querying database for forms from cs = " + cs + " @" + visit_date);
            var SQL ='SELECT s._id, s.nome, s.nome_casa, s.sexo, s.id_paciente, s.dn, s.cs, s.consultor, s.ano, s.mes, r._id IS NOT NULL as HasResult, s.diagnostico IS NOT NULL as HasConsult, r._id as resultId FROM sentinela s LEFT JOIN resultado r ON s._id = r.id_formssentinela AND r._savepoint_type = "COMPLETE" WHERE s.cs = "' + cs + '" COLLATE NOCASE AND s.consultor = "' + consultor + '" COLLATE NOCASE AND s.envio_tdr = 1  AND s._savepoint_timestamp > datetime("now", "-24 hours") COLLATE NOCASE AND s._savepoint_type = "COMPLETE"';
            performQuery(SQL);            
        }
        hasConsult
        function searchId(strId) {
            if (TESTMODE) return;
            console.log("Querying database for consultas with id_paciente = " + strId);
            var SQL ='SELECT s._id, s.nome, s.nome_casa, s.sexo, s.id_paciente, s.dn, s.cs, s.consultor, s.ano, s.mes, r._id IS NOT NULL as HasResult, s.diagnostico IS NOT NULL as HasConsult, r._id as resultId FROM sentinela s LEFT JOIN resultado r ON s._id = r.id_formssentinela AND r._savepoint_type = "COMPLETE" WHERE s.id_paciente = "' + strId + '" COLLATE NOCASE AND s._savepoint_type = "COMPLETE"';
            performQuery(SQL);            
        }
        
        function performQuery(SQL) {
            var successFn = function( result ) {
                console.log("Got " + result.getCount() + " forms");
                var persons = [];
                for (var row = 0; row < result.getCount(); row++) {
                    var id_formssentinela = result.getData(row,"_id");
                    var id_paciente = result.getData(row,"id_paciente");
                    var nome =  result.getData(row,"nome");
                    var nome_casa =  result.getData(row,"nome_casa");
                    var sexo =  result.getData(row,"sexo");
                    var dn =  result.getData(row,"dn");
                    var ano = result.getData(row,"ano");
                    var mes = result.getData(row,"mes");

                    var cs =  result.getData(row,"cs");
                    var consultor = result.getData(row, "consultor");
                    var hasResult =  result.getData(row,"HasResult") == "1";
                    var hasConsult = result.getData(row, "HasConsult") == "1";
                    var resultId = result.getData(row, "resultId");
                    var p = {
                        id_formssentinela,
                        id_paciente,
                        nome,
                        nome_casa,
                        sexo,
                        dn,
                        ano,
                        mes,
                        cs,
                        consultor,
                        hasResult,
                        hasConsult,
                        resultId
                    }
                    console.log(p);
                    persons.push(p);
                }
                populateList(persons);
                return;
            }
            
            var failureFn = function( errorMsg ) {
                console.error('Failed to get persons from database: ' + errorMsg);
                console.error('SQL query used was:');
                console.error(SQL);
            }
            odkData.arbitraryQuery('sentinela', SQL, null, null, null, successFn, failureFn);
        }

        function getCenterName(strCs, strConsultor) {
            var con = (strConsultor) ? " (" + getConsultorName(strConsultor) + ")" : "";
            switch (strCs) {
                case "SB": return "Buba" + con;
                case "SH": return "Canchungo" + con;
                case "SGC": return "Gabú (CMI)" + con;
                case "SGA": return "Gabú (hospital)" + con;
                case "SBM": return "B. Militar" + con;
                default: return strCs + con;
            }
        }

        function getConsultorName(strConsultor) {
            switch (strConsultor) {
                case "CEP": return "Consulta Externa Pediatria";
                case "CUP": return "Urgência Pediatria";
                case "CEA": return "Consulta externa Adulto";
                case "CUA": return "Urgência Adulto";
                default: return strConsultor;
            }
        }

        /* adate helper */
        function getAdateHelper() {return {
            getMoment: function(aDate) {
                if (!aDate || aDate.length<4 || this.yearUnknown(aDate)) {
                    return false;
                }
                aDate = aDate.toUpperCase().replace('D:NS','D:15').replace('M:NS','M:5');
                var d = moment(aDate, '\\D:DD,\\M:MM,\\Y:YYYY');
                if (d.isValid()) {
                    return d;
                }
                return false;
            },
            hasUncertainty: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('NS')>-1;   
            },
            yearUnknown: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('Y:NS')>-1;
            },
            monthUnkown: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('M:NS')>-1;   
            },
            dayUnkown: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('D:NS')>-1;
            },
            ageIn: function(aDate, strUnit) {
                var a = this.getMoment(aDate);
                if (!a) {
                    return -9999;
                }
                return moment().diff(a,strUnit);
            },
            ageInYears: function(aDate) {
                return this.ageIn(aDate, 'years');
            },
            ageInMonths: function(aDate) {
                return this.ageIn(aDate, 'months');
            },
            ageInDays: function(aDate) {
                return this.ageIn(aDate, 'days');
            },
            diffInYears: function(aDateA, aDateB) {
                var a = this.getMoment(aDateA);
                var b = this.getMoment(aDateB);
                if (!a || !b) {
                    return -9999;
                }
                return b.diff(a,'years');
            }            
        }};
