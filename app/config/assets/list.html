        /* DISPLAY STUFF */
        function getSexoString(sexo) {
            if (sexo == "1" || sexo == 1) return "M";
            if (sexo == "2" || sexo == 2) return "F";
            return "?";
        }
        function getAgeString(person) {
            var theAdate = person.dn;
            if (!theAdate) {
                var res = (person.ano) ? person.ano : "0";
                if (person.mes) res = res + ("." + person.mes);
                return res;
            }    
            return "" + adateHelper.ageInYears(theAdate) + "." + (adateHelper.ageInMonths(theAdate) % 12);
        }

        function addPersonDiv(p) {    
            var nome = (p.nome_casa && p.nome_casa.length) ? nome = p.nome + " (" + p.nome_casa + ")" : p.nome;        
            var row = "<tr class='lab" + p.hasResult + "'><td>" + p.id_paciente + "</td><td>" + nome + "</td><td>" + getSexoString(p.sexo) + "</td><td>" + getAgeString(p) + "</td><td><input type='button' value=' ' class='arrow'></input></td></tr>";
            $('#theList tr:last').after(row);
            if (!p.hasResult) {
                $('#theList tr:last').on("click",function() { 
                    addResult(p);
                    return false;
                });
            } else {
                $('#theList tr:last').on("click",function() { 
                    editResult(p);
                    return false;
                });
            }
        }

        function populateList(listOfPersons) {
            if (!listOfPersons || !listOfPersons.length) {
                
                return;
            }
            var theList = $("#theList");
            console.log("Populating list with " + listOfPersons.length + " persons");
            listOfPersons.forEach(person => {
                addPersonDiv(person);
            });
        }

        /* DB LOOKUP */
        var TESTMODE = false;
        function listRows(cs, visit_date) {
            if (TESTMODE) return;
            console.log("Querying database for forms from cs = " + cs + " @" + visit_date);
            var SQL ='SELECT s._id, s.nome, s.nome_casa, s.sexo, s.id_paciente, s.dn, s.cs, r._id IS NOT NULL as HasResult FROM sentinela s LEFT JOIN resultado r ON s._id = r.id_formssentinela AND r._savepoint_type = "COMPLETE" WHERE s.cs = "' + cs + '" COLLATE NOCASE AND s._savepoint_timestamp > datetime("now", "-24 hours") COLLATE NOCASE AND s._savepoint_type = "COMPLETE"';
            performQuery(SQL);            
        }

        function searchId(strId) {
            if (TESTMODE) return;
            console.log("Querying database for consultas with id_paciente = " + strId);
            var SQL ='SELECT s._id, s.nome, s.nome_casa, s.sexo, s.id_paciente, s.dn, s.cs, r._id IS NOT NULL as HasResult FROM sentinela s LEFT JOIN resultado r ON s._id = r.id_formssentinela AND r._savepoint_type = "COMPLETE" WHERE s.id_paciente = "' + strId + '" COLLATE NOCASE AND s._savepoint_type = "COMPLETE"';
            performQuery(SQL);            
        }
        
        function performQuery(SQL) {
            var successFn = function( result ) {
                console.log("Got " + result.getCount() + " forms");
                var persons = [];
                for (var row = 0; row < result.getCount(); row++) {
                    var id_formssentinela = result.getData(row,"_id");
                    var id_paciente = result.getData(row,"id_paciente");
                    var nome =  result.getData(row,"nome");
                    var nome_casa =  result.getData(row,"nome_casa");
                    var sexo =  result.getData(row,"sexo");
                    var dn =  result.getData(row,"dn");
                    var cs =  result.getData(row,"cs");
                    var hasResult =  result.getData(row,"HasResult");
                    var p = {
                        id_formssentinela,
                        id_paciente,
                        nome,
                        nome_casa,
                        sexo,
                        dn,
                        cs,
                        hasResult
                    }
                    console.log(p);
                    persons.push(p);
                }
                populateList(persons);
                return;
            }
            
            var failureFn = function( errorMsg ) {
                console.error('Failed to get persons from database: ' + errorMsg);
                console.error('SQL query used was:');
                console.error(SQL);
            }
            odkData.arbitraryQuery('sentinela', SQL, null, null, null, successFn, failureFn);
        }

        function getCenterName(strCs) {
            switch (strCs) {
                case "SB": return "Buba";
                case "SH": return "Canchungo";
                case "SGC": return "Gabú (CMI";
                case "SGH": return "Gabú (hospital";

                default: return strCs;
            }
        }

        /* adate helper */
        function getAdateHelper() {return {
            getMoment: function(aDate) {
                if (!aDate || aDate.length<4 || this.yearUnknown(aDate)) {
                    return false;
                }
                aDate = aDate.toUpperCase().replace('D:NS','D:15').replace('M:NS','M:5');
                var d = moment(aDate, '\\D:DD,\\M:MM,\\Y:YYYY');
                if (d.isValid()) {
                    return d;
                }
                return false;
            },
            hasUncertainty: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('NS')>-1;   
            },
            yearUnknown: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('Y:NS')>-1;
            },
            monthUnkown: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('M:NS')>-1;   
            },
            dayUnkown: function(aDate) {
                return !aDate || aDate.toUpperCase().indexOf('D:NS')>-1;
            },
            ageIn: function(aDate, strUnit) {
                var a = this.getMoment(aDate);
                if (!a) {
                    return -9999;
                }
                return moment().diff(a,strUnit);
            },
            ageInYears: function(aDate) {
                return this.ageIn(aDate, 'years');
            },
            ageInMonths: function(aDate) {
                return this.ageIn(aDate, 'months');
            },
            ageInDays: function(aDate) {
                return this.ageIn(aDate, 'days');
            },
            diffInYears: function(aDateA, aDateB) {
                var a = this.getMoment(aDateA);
                var b = this.getMoment(aDateB);
                if (!a || !b) {
                    return -9999;
                }
                return b.diff(a,'years');
            }
        }};
